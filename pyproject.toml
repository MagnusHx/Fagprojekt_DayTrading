[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[project]
name = "kvant"
version = "0.0.1"
description = "Quant research project for short-horizon US equity trading. The current pipeline prepares train-only fitted CUSUM-sampled triple-barrier event outcomes, trains a primary side model, adds a meta-label decision layer, and evaluates acted trades, abstentions, and transaction-cost-aware economics."
authors = [
  { name = "group 1", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.6.0",
    "fastapi==0.115.6",
    "huggingface-hub>=1.4.1",
    "pandas-market-calendars>=5.0.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.5.2",
    "torch==2.6.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "vectorbt>=0.28.2",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
